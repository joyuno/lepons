      #fileBody {
        width: 100%; padding: 8px 10px; background: var(--ground); color: var(--text);
        border: 1px solid var(--line); border-radius: 5px; font: 12px var(--mono); resize: vertical;
      }
      #fileBody:focus { border-color: var(--live); outline: none; }

      /* --- map -------------------------------------------------------- */
      .mapPad { padding: 26px 28px; }
      .mapEmpty { color: var(--muted); padding: 26px 28px; }
      .mapLines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
      .mapEdge {
        fill: none; stroke: var(--muted); stroke-width: 1.75; opacity: .8;
        pointer-events: stroke; cursor: pointer; stroke-linecap: round;
        transition: opacity var(--t-fast) var(--ease), stroke-width var(--t-fast) var(--ease);
      }
      /* Head swapped with the line so a hovered edge is one colour end to end. */
      .mapEdge:hover { stroke: var(--live); stroke-width: 3; opacity: 1; marker-end: url(#mapArrowHot); }
      /* Not a share yet: dashed until a click makes it one. */
      .mapEdge.suggested { stroke-dasharray: 6 5; opacity: .55; }
      /* Pinned to the view's bottom-left while the board scrolls under it; no
         height of its own, so the board's geometry is unchanged. The line is
         lifted above that zero height, inside the view. */
      .mapLegend { position: sticky; bottom: 0; left: 0; height: 0; z-index: 3; pointer-events: none; }
      .mapLegend span {
        display: inline-block; margin: 0 0 0 10px; padding: 2px 7px; transform: translateY(calc(-100% - 8px));
        border-radius: 4px; font-size: 10.5px; line-height: 1.4; color: var(--muted); white-space: nowrap;
        background: color-mix(in srgb, var(--panel) 80%, transparent);
      }
      /* Only an edge that already carries a start head gets its start head
         recoloured -- setting the property outright would grow a second
         arrowhead on every one-way edge the moment it is hovered. */
      .mapEdge[marker-start]:hover { marker-start: url(#mapArrowHot); }
      /* A faint dot grid is the one signal every freely-positionable canvas
         (Miro, FigJam, dbdiagram.io) shares -- it's what tells the eye "this
         can be rearranged" before a hand ever touches a card. */
      .mapBoard {
        position: relative;
        background-image: radial-gradient(var(--grid) 1.4px, transparent 1.4px);
        background-size: 24px 24px;
      }
      .mapCard {
        position: absolute; left: 0; top: 0; width: 224px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 9px; padding: 12px;
        box-shadow: 0 8px 20px -6px rgba(0, 0, 0, .45);
        z-index: 0;
      }
      .mapCard.dropTarget { border-color: var(--live); }
      .mapCard.dragging { box-shadow: 0 14px 34px -8px rgba(0, 0, 0, .6); z-index: 10; }
      .mapCardHead {
        display: flex; align-items: center; gap: 8px; margin-bottom: 9px;
        border-bottom: 1px solid var(--line); padding-bottom: 8px; cursor: grab;
      }
      .mapCardHead .name {
        font-family: var(--sans); font-size: 11.5px; flex: 1;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .kindTag {
        font: 10px var(--sans); color: var(--muted); border: 1px solid var(--line);
        border-radius: 3px; padding: 2px 6px;
      }
      /* Which agent a session is: Claude in the live amber, Codex in the link
         teal, Grok in plain text, Antigravity muted, Cursor dim, so they read apart on one board without a legend. */
      .agentTag {
        flex: 0 0 auto; align-self: flex-start; font: 600 9.5px var(--sans); letter-spacing: .04em;
        border-radius: 3px; padding: 1px 5px; border: 1px solid currentColor; opacity: .9;
      }
      .agentTag.claude { color: var(--live); }
      .agentTag.codex { color: var(--link); }
      .agentTag.grok { color: var(--text); }
      .agentTag.opencode { color: var(--text); }
      .agentTag.agy { color: var(--muted); }
      .agentTag.agent { color: var(--dim); }
      .mapAgents { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 2px 0 6px; font-size: 10.5px; color: var(--muted); }
      .mapAgents .agentTag { cursor: pointer; background: none; white-space: nowrap; }
      .mapAgents .agentTag.off { opacity: .45; border-style: dashed; color: var(--muted); }
      .mapApplying { font-size: 10.5px; color: var(--muted); margin: 0 0 6px; animation: lampBreathe 1.4s ease-in-out infinite; }
      button.mapApplyFailed { display: block; border: 0; background: none; padding: 0 0 6px; text-align: left; font: inherit; font-size: 10.5px; cursor: pointer; }
      button.mapApplyFailed:hover { text-decoration: underline; }
      body.mapDragging { cursor: grabbing; }
      .mapGroupHead {
        font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
        color: var(--muted); margin: 10px 0 4px;
      }
      .mapGroupHead:first-of-type { margin-top: 2px; }
      .mapRepo {
        background: var(--ground); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 9px; margin-top: 6px; cursor: grab; font: 12px var(--sans);
      }
      .mapRepo:hover { border-color: var(--muted); }
      .mapRepo.dragging { opacity: .35; }
      /* Agent session data is not a folder the operator picked, so it reads as
         a different kind of chip at a glance. */
      .mapRepo-agentData { border-style: dashed; color: var(--muted); }
      .mapNoRepo { color: var(--muted); font-size: 11px; }
      .notifyBadge {
        display: inline-block; margin-left: 6px; min-width: 15px; padding: 0 5px;
        border-radius: 8px; background: var(--live); color: #21160a;
        font-size: 10px; line-height: 15px; text-align: center; font-weight: 600;
      }
      #workflowBadge[hidden] { display: none; }
      /* The session detail's vertical timeline, newest step lit amber. */
      .wfSteps {
        list-style: none; margin: 2px 0 0 9px; padding: 0 0 0 13px;
        border-left: 1px solid var(--line);
      }
      .wfStep {
        position: relative; padding: 3px 0 3px 2px; display: flex; gap: 7px;
        color: var(--muted); font-size: 11px;
      }
      .wfStep::before {
        content: ""; position: absolute; left: -16.5px; top: 8px;
        width: 6px; height: 6px; border-radius: 50%; background: var(--line);
      }
      .wfStep.now { color: var(--text); }
      .wfStep.now::before { background: var(--live); }
      .wfStep .t { flex: 0 0 auto; font-family: var(--sans); font-variant-numeric: tabular-nums; font-size: 10px; padding-top: 1px; color: var(--muted); }
      /* min-width:0 so the clamped text ellipsizes instead of blowing out the card. */
      .wfStep .x {
        flex: 1; min-width: 0; overflow: hidden; word-break: break-word;
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      }
      .wfNote { color: var(--muted); font-size: 12px; }
      /* The human's own prompts stand out from the assistant's narration. */
      .wfStep.prompt .x { color: var(--text); }
      /* Pooled tool calls ("Edit map.ts · Bash npm test") read as machinery. */
      .wfStep.act .x { font-family: var(--sans); font-size: 10px; }
      /* A dispatched subagent renders as a branch card off the timeline:
         amber spine while it matches the "live" convention, link-blue while
         still running. */
      .wfStepAgent { align-items: flex-start; }
      .wfBranch {
        flex: 1; min-width: 0; border-left: 2px solid var(--live);
        background: var(--raise); border-radius: 6px; padding: 7px 10px; margin: 2px 0;
      }
      .wfBranch.running { border-left-color: var(--go); }
      .wfBranchHead { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); }
      .runTag { font: 10px var(--sans); color: var(--link); }
      .wfTranslate {
        margin-left: auto; border: 1px solid var(--line); background: none; color: var(--muted);
        font: 10px var(--sans); padding: 1px 6px; border-radius: 3px; cursor: pointer;
      }
      .wfTranslate:hover { color: var(--text); border-color: var(--muted); }
      .wfTranslate:disabled { cursor: progress; opacity: .7; }
      .wfNotice { font-size: 11px; color: var(--muted); margin: 0 0 10px; }
      .wfBranch .line {
        color: var(--muted); font-size: 11px; margin-top: 4px;
        white-space: pre-wrap; word-break: break-word;
      }

      /* --- guide ------------------------------------------------------ */
      .guide { max-width: 720px; padding: 32px 34px 64px; }
      .guide h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -.015em; }
      .guideLead { color: var(--muted); margin: 0 0 30px; max-width: 58ch; }
      .guideSection { margin-bottom: 32px; }
      .guideSection h2 { font-size: 13px; margin: 0 0 11px; display: flex; align-items: baseline; gap: 10px; }
      .guideMarker {
        font: 10px var(--sans); letter-spacing: .06em; color: var(--muted);
        border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; white-space: nowrap;
      }
      .guideStatus { display: flex; align-items: baseline; gap: 8px; margin: 7px 0; font-size: 12.5px; }
      .guideMark { font: 600 12px var(--sans); width: 14px; text-align: center; }
      .guideStatus.ok .guideMark { color: var(--go); }
      .guideStatus.todo .guideMark { color: var(--stop); }
      .guideCode { margin: 10px 0 4px; }
      .guideCode code, .shareBox code {
        display: block; white-space: pre-wrap; word-break: break-all;
        background: var(--ground); border: 1px solid var(--line); border-radius: 7px;
        padding: 11px 13px; font: 11.5px/1.7 var(--mono); color: var(--text); cursor: pointer;
      }
      .shareBox code:hover { border-color: var(--live); }
      /* The guide's commands: where to run it above, the copy button beside. */
      .guideWhere { color: var(--muted); font-size: 12px; margin-bottom: 5px; max-width: 62ch; }
      .guideLine { display: flex; gap: 8px; align-items: flex-start; }
      .guideLine code { flex: 1; min-width: 0; cursor: text; user-select: text; }
      .guideCopy, .guideButton {
        flex: none; border: 1px solid var(--line); background: var(--raise); color: var(--text);
        border-radius: 6px; padding: 6px 11px; font-size: 12px; cursor: pointer;
      }
      .guideCopy:hover, .guideButton:hover { border-color: var(--live); }
      .guideButton { margin-top: 10px; }
      .guideSub { font-size: 12.5px; font-weight: 600; margin: 18px 0 2px; }
      .guideWarn {
        font-size: 12px; margin: 14px 0 0; padding: 9px 12px; max-width: 62ch;
        border-left: 3px solid var(--live); background: var(--ground); border-radius: 0 6px 6px 0;
      }
      .guideHint { color: var(--muted); font-size: 12px; margin: 6px 0 0; max-width: 60ch; }
      .guideList { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
      .guideList li { margin: 7px 0; max-width: 62ch; }

      /* --- share panel ------------------------------------------------ */
      .shareBox { padding: 2px 18px 10px; }
      .shareHint { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
      /* The folder's contents, off by default -- the rail lists sessions
         first, and an always-open tree would bury the next machine. */
      .treeToggle {
        border: 0; background: none; color: var(--muted);
        font-size: 18px; line-height: 1; padding: 4px 6px; cursor: pointer;
        flex: 0 0 auto; border-radius: 4px;
      }
      .treeToggle:hover, .treeToggle.on { color: var(--live); }
      /* Chevrons drawn as a line, VS Code's, not a filled triangle: two
         borders of a square, turned. Down by default; .right and .up turn it. */
      .chev::before {
        content: ""; display: inline-block; width: 6px; height: 6px;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
      }
      .chev.right::before { transform: rotate(-45deg); }
      .chev.up::before { transform: translateY(1px) rotate(-135deg); }
      .treeToggle.chev { font-size: 0; padding: 7px 6px; margin: 0 -6px 0 -8px; }
      /* Sizes step down with depth: machine 6px, folder 5px, file tree 4px. */
      .treeToggle.chev::before { width: 5px; height: 5px; }
      .foldToggle { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 4px; flex: 0 0 auto; }
      .foldToggle:hover { color: var(--text); }
      .fileTree { padding-right: 10px; }
      .fileTree .fileTree { padding-right: 0; }
      .treeBar { display: flex; justify-content: flex-end; gap: 2px; padding: 2px 14px 2px 18px; }
      .treeBar .iconBtn { display: inline-flex; padding: 3px; border-radius: 4px; }
      .treeBar.searching { justify-content: flex-start; align-items: center; gap: 4px; }
      .treeSearchInput {
        flex: 1; min-width: 0; height: 22px; padding: 0 6px; border-radius: 4px;
        border: 1px solid var(--line); background: var(--ground); color: var(--text); font: 11px var(--sans);
      }
      .treeSearchInput:focus { outline: none; border-color: var(--link); }
      .treeSearchInput::-webkit-search-cancel-button { display: none; }
      .fileWhere { flex: 0 1 auto; min-width: 0; margin-left: auto; padding-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; opacity: .6; font-size: 10px; }
      .treeSearchResults .fileRow { padding-left: 14px; }
      .treeSearchResults .fileRow:focus-visible { outline: 1px solid var(--link); outline-offset: -1px; }
      .fileRow {
        display: flex; align-items: center; gap: 5px; width: 100%; text-align: left;
        border: 0; background: none; color: var(--muted); font: 11px var(--sans);
        padding: 2px 0; cursor: pointer;
      }
      .fileRow:hover { color: var(--text); }
      .fileChevron { flex: 0 0 9px; font-size: 10px; text-align: center; }
      .fileChevron.chev::before { width: 4px; height: 4px; }
      .fileIcon { flex: 0 0 16px; width: 16px; height: 16px; }
      .fileName { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .forwardChip { display: inline-flex; align-items: center; }
      #broadcastText {
        width: 100%; box-sizing: border-box; resize: vertical; margin: 4px 0 10px;
        background: var(--raise); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
        padding: 8px 10px; font: inherit; font-size: 12.5px;
      }
      #broadcastList { max-height: 220px; overflow: auto; margin: 0 0 6px 18px; }
      #browseMakeRow { gap: 6px; margin-top: 10px; }
      #browseNewName { flex: 1; }
      #browseMakeRow button { flex: 0 0 auto; }
      .fileNote { color: var(--muted); font-size: 10.5px; padding: 2px 0; }
      .warn { color: var(--stop); font-size: 11px; padding: 0 18px 6px; }
      .warn button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
      button.shareDown {
        display: block; width: 100%; border: 0; background: none; text-align: left;
        font: inherit; font-size: 11px; cursor: pointer;
      }
      button.shareDown:hover { text-decoration: underline; }
      /* Filled, so it stands out among the head's plain icons. */
      .paneBtn.attention { color: var(--live); background: color-mix(in srgb, var(--live) 16%, transparent); padding: 2px 6px; }
      /* The app's own tooltip, replacing the browser's native title bubble. */
      #hoverTip {
        position: fixed; z-index: 99; max-width: 380px; pointer-events: none;
        background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
        padding: 7px 10px; font-size: 11px; color: var(--text); line-height: 1.5;
        white-space: pre-wrap; word-break: break-word;
        box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .55);
      }
      #hoverTip[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after, ::backdrop { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <aside id="rail">
      <!-- App-wide controls on top, the machines filling the middle, and at
           the foot the one thing a new operator does first -- add a machine
           -- with the two views to switch to under it. -->
      <div class="railHead">
        <!-- Settings first, in the corner, then the phone page (its state in
             the icon's colour, a menu on click). On macOS main.ts moves both,
             and the toggle, into the title bar. -->
        <button class="railIconBtn" id="settingsButton"></button>
        <button class="railIconBtn" id="phoneButton"></button>
        <span class="railDrag"></span>
        <button id="railToggle">«</button>
      </div>
      <div id="workspaces"></div>
      <div class="railFoot">
        <!-- Plan usage, while a session is open; hidden with its own switch. -->
        <div id="usageBar" hidden>
          <button type="button" id="usageToggle" class="iconBtn"></button>
          <span id="usageText"></span>
        </div>
        <button class="railBtn" id="openBroadcast" data-i18n="broadcast.open" hidden></button>
        <button class="railBtn primary" id="addMachine" data-i18n="rail.addMachine"></button>
        <div class="railTabs">
          <!-- An icon beside each word: two plain words at the rail's foot went unseen. -->
          <button class="railBtn railTab" id="openMap">
            <svg class="railTabIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg><span data-i18n="rail.map"></span>
          </button>
          <button class="railBtn railTab" id="openWorkflow">
            <svg class="railTabIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18.5" r="2.5"/><circle cx="19" cy="18.5" r="2.5"/><path d="M10.8 7.3 6.2 16.2M13.2 7.3l4.6 8.9M7.5 18.5h9" stroke-dasharray="1.5 2.5"/></svg><span data-i18n="workflow.toggle"></span>
            <span id="workflowBadge" class="notifyBadge" hidden></span>
          </button>
        </div>
      </div>
      <div id="railEdge"></div>
    </aside>

    <main>
      <div id="titleBar"><span class="titleDrag"></span><button class="wmPill" id="waitingPill" type="button" hidden></button><button class="paneBtn" id="splitRight" data-direction="row"></button><button class="paneBtn" id="splitDown" data-direction="column"></button><div id="winControls"><button id="winMin">─</button><button id="winMax">□</button><button id="winClose">✕</button></div></div>
      <div id="contentRow">
        <div id="terminal"></div>
        <div id="map" hidden></div>
        <div id="guide" hidden></div>
        <div id="workflow" hidden></div>
        <div id="zoomBar" hidden>
          <button id="zoomOut" type="button" title="−">−</button>
          <span id="zoomPct">100%</span>
          <button id="zoomIn" type="button" title="+">+</button>
        </div>
      </div>
    </main>

    <div id="phoneToast" role="status" popover="manual" hidden></div>

    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle" data-i18n="settings.title"></h2>
      <div class="settingsBody">
        <nav id="settingsNav"></nav>
        <section id="settingsPanel"></section>
      </div>
    </dialog>

    <dialog id="stopDialog" aria-labelledby="stopTitle">
      <form method="dialog">
        <h2 id="stopTitle" data-i18n="session.stop"></h2>
        <p class="sub" id="stopText"></p>
        <div class="row">
          <button value="stop" data-i18n="session.stopConfirmYes"></button>
          <button value="" data-i18n="common.cancel"></button>
        </div>
      </form>
    </dialog>

    <dialog id="broadcastDialog" aria-labelledby="broadcastTitle">
      <h2 id="broadcastTitle" data-i18n="broadcast.title"></h2>
      <p class="sub" data-i18n="broadcast.sub"></p>
      <textarea id="broadcastText" rows="5"></textarea>
      <label class="resumeOpt"><input type="checkbox" id="broadcastAll" /> <span data-i18n="broadcast.all"></span></label>
      <div id="broadcastList"></div>
      <label class="resumeOpt"><input type="checkbox" id="broadcastEnter" checked /> <span data-i18n="broadcast.enter"></span></label>
      <div class="row">
        <button type="button" class="go" id="broadcastSend" data-i18n="broadcast.send"></button>
        <button type="button" id="broadcastCancel" data-i18n="common.cancel"></button>
      </div>
    </dialog>

    <dialog id="restoreDialog" aria-labelledby="restoreTitle">
      <form method="dialog">
        <h2 id="restoreTitle" data-i18n="restore.title"></h2>
        <p class="sub" id="restoreText" style="white-space: pre-line"></p>
        <label class="resumeOpt" id="restoreAlwaysRow"><input type="checkbox" id="restoreAlways" /> <span data-i18n="restore.always"></span></label>
        <div class="row">
          <button value="restore" class="go" id="restoreYes" data-i18n="restore.yes"></button>
          <button value="" id="restoreNo" data-i18n="restore.no"></button>
        </div>
      </form>
    </dialog>

    <dialog id="importDialog" aria-labelledby="importTitle">
      <h2 id="importTitle" data-i18n="import.title"></h2>
      <p class="sub" data-i18n="import.sub"></p>
      <div id="importList"></div>
      <div class="note" id="importNote"></div>
      <div class="row">
        <button type="button" class="go" id="importRun" data-i18n="import.run"></button>
        <button type="button" id="importClose" data-i18n="common.close"></button>
      </div>
    </dialog>

    <dialog id="installDialog" aria-labelledby="installTitle">
      <form method="dialog">
        <h2 id="installTitle"></h2>
        <p class="sub" id="installText" style="white-space: pre-line"></p>
        <div class="row">
          <button value="install" class="go" data-i18n="install.run"></button>
          <button value="" data-i18n="common.cancel"></button>
        </div>
      </form>
    </dialog>

    <dialog id="executorDialog" class="picker" aria-labelledby="executorTitle">
      <form method="dialog">
        <div class="exHead"><h2 id="executorTitle"></h2><span class="sub" id="executorWhere"></span></div>
        <!-- Only from "worktree에서 AI 추가": what is there now, and change it or add one beside it. -->
        <div class="exWorktree" id="executorWorktree" hidden>
          <span class="exWorking" id="executorWorking"></span>
          <span class="seg" role="group">
            <button type="button" id="executorModeChange" aria-pressed="false" data-i18n="worktree.modeChange"></button>
            <button type="button" id="executorModeAdd" aria-pressed="true" data-i18n="worktree.modeAdd"></button>
          </span>
          <input type="text" id="executorTask" maxlength="60" />
        </div>
        <div class="exTiles" id="executorTiles" role="group" aria-labelledby="executorTitle"></div>
        <div class="exLlms" id="executorLlms" role="group"></div>
        <div class="exOpts">
          <span class="seg" id="executorResumeRow" role="group">
            <button type="button" id="executorResume" aria-pressed="true" data-i18n="session.resumeLast"></button>
            <button type="button" id="executorFresh" aria-pressed="false" data-i18n="session.fresh"></button>
            <button type="button" id="executorPick" data-i18n="past.pick"></button>
          </span>

          <button type="submit" class="go" data-i18n="common.confirm"></button>
          <button type="button" id="passphraseCancel" data-i18n="common.cancel"></button>
        </div>
      </form>
    </dialog>

    <dialog id="loginDialog" aria-labelledby="loginTitle">
      <form id="loginForm">
        <h2 id="loginTitle"></h2>
        <p class="sub" id="loginText"></p>
        <div class="loginCode" id="loginCodeRow">
          <output id="loginCode"></output>
          <button type="button" id="loginCopy" data-i18n="settings.login.copy"></button>
        </div>
        <input id="loginInput" type="text" autocomplete="off" spellcheck="false" />
        <div class="row">
          <button type="submit" class="go" id="loginOk" data-i18n="common.confirm"></button>
          <button type="button" id="loginTerminal" data-i18n="settings.login.terminal"></button>
          <button type="button" id="loginCancel" data-i18n="common.cancel"></button>
        </div>
      </form>
    </dialog>

    <dialog id="askDialog" aria-labelledby="askMessage" aria-describedby="askDetail">
      <form method="dialog">
        <h2 id="askMessage"></h2>
        <p class="sub" id="askDetail"></p>
        <div class="row" id="askButtons"></div>
      </form>
    </dialog>

    <script src="renderer.js"></script>
  </body>
</html>
