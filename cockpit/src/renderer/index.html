<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src data: 'self'; frame-src data:"
    />
    <title>Lepons</title>
    <link rel="stylesheet" href="renderer.css" />
    <style>
      /*
        A cockpit for machines, so the surface is an instrument panel rather
        than a terminal chrome: a cool slate ground with one warm signal colour.
        Amber is spent only on things that are live; everything else stays
        quiet, so a running session is the first thing the eye finds.
      */

      /* Pretendard carries Korean + Latin (rail, dialogs, guide prose).
         Noto Sans SC is subsetted to just the glyphs the zh dictionary uses —
         arbitrary Chinese text outside that fixed vocabulary still falls
         back to the OS font, same as before this stack existed. */
      @font-face {
        font-family: "Pretendard Variable";
        src: url("fonts/PretendardVariable.woff2") format("woff2");
        font-weight: 45 920;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Noto Sans SC";
        src: url("fonts/NotoSansSC-Subset.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* Code fonts the settings offer, bundled so a pick works on any PC.
         D2Coding ships no bold and no woff2: bold is synthesized. */
      @font-face {
        font-family: "D2Coding";
        src: url("fonts/D2Coding.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/JetBrainsMono-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Fira Code";
        src: url("fonts/FiraCode-VF.woff2") format("woff2");
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        /* The rail's head and the bar over the panes: one height, so they line up. */
        --topBar: 32px;
        --ground: #11161d;
        /* Usage chart series, the phone's (mobile/src/ui.tsx). */
        --series0: #1fa0ba; --series1: #b88c25; --series2: #7f79e3; --series3: #d6688e; --series4: #588018; --series5: #6b7685;
        --panel: #171e26;
        --raise: #1e2731;
        --line: #232d38;
        /* Canvas dots: visible enough to read as a pannable board, faint
           enough that the graph on top stays the subject. */
        --grid: rgba(123, 135, 150, .22);
        --text: #cdd6e0;
        --muted: #7b8796;
        --dim: #55606d;
        --idle: #3a4552;
        --live: #e8a33d;
        --live-dim: #5a4526;
        --link: #5fb3c4;
        --go: #3fb950;
        --stop: #ec5d5e;
        --scroll: #2c3742;
        --scroll-hover: #3a4753;
        --rail: 244px;
        /* How things move: one curve, three durations. motion.ts holds the same values. */
        --ease: cubic-bezier(0.2, 0, 0, 1);
        --t-fast: 120ms;
        --t-mid: 220ms;
        --t-slow: 360ms;
        --mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
        --sans:
          "Pretendard Variable", "Noto Sans SC", "Segoe UI Variable Text", "Segoe UI",
          system-ui, sans-serif;
      }
      /* Same instrument panel, lit from the front instead of the back --
         every surface and accent flips, the layout and spacing don't. */
      :root[data-theme="light"] {
        /* Soft grey, not paper white: the rail and dialogs sit a step darker
           than the work area, as VS Code's Light Modern and Linear do, so the
           window has depth without one large white field. */
        --ground: #f3f4f6;
        --series0: #00849f; --series1: #b58b24; --series2: #5d55b3; --series3: #d9708f; --series4: #586008; --series5: #8c959f;
        --panel: #e9ebef;
        --raise: #dfe2e7;
        --line: #d2d6dc;
        --grid: rgba(107, 117, 128, .28);
        --text: #1f2328;
        --muted: #59636e;
        --dim: #8c959f;
        --idle: #b6bec7;
        --live: #b8720f;
        --live-dim: #e8c99a;
        --link: #2f7c8a;
        --go: #1a7f37;
        --stop: #dc3e42;
        --scroll: #c9ced4;
        --scroll-hover: #b3bac2;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; display: flex; background: var(--ground); color: var(--text);
        font: 13px/1.55 var(--sans); overflow: hidden;
      }
      button { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
      /* Buttons along the window's top edge (⚙, phone, «, the split and window
         buttons) sit 2px from the frame: a ring drawn outside them lost its
         top edge, so theirs is drawn just inside. */
      .railHead button:focus-visible, #titleBar button:focus-visible { outline-offset: -2px; }

      /* Scrollbars, everywhere at once.
         Left unstyled, Chromium draws the platform's own -- which on this
         Windows build is the wide grey one from a decade ago, sitting inside
         a dark instrument panel. These rules are global rather than per-pane
         so a scrolling surface added later cannot forget to match: the rail,
         both boards, the guide, the dialog lists and xterm's viewport all
         inherit them without naming any of them. */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--scroll) transparent;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll); border-radius: 6px;
        /* The border is transparent padding, not a frame: it keeps the thumb
           off the pane edge without a second colour to keep in step. */
        border: 2px solid transparent; background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); background-clip: content-box; }
      /* Where two scrollbars meet; unstyled it is a pale square. */
      ::-webkit-scrollbar-corner { background: transparent; }

      /* --- rail ------------------------------------------------------- */
      #rail {
        width: var(--rail); flex: 0 0 var(--rail); background: var(--panel);
        border-right: 1px solid var(--line); display: flex; flex-direction: column;
        transition: width var(--t-fast) var(--ease), flex-basis var(--t-fast) var(--ease); overflow: hidden; position: relative;
      }
      body.railCollapsed #rail { width: 42px; flex-basis: 42px; }
      /* The rail's right edge, dragged to set its width. */
      #railEdge { position: absolute; top: 0; right: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 2; }
      #railEdge:hover, body.railDragging #railEdge { background: var(--line); }
      body.railDragging #rail { transition: none; }
      body.railCollapsed #railEdge { display: none; }
      body.railCollapsed .railHead #phoneButton,
      body.railCollapsed .railTabs,
      body.railCollapsed #workspaces,
      body.railCollapsed .railFoot { display: none; }
      /* Collapsed, ⚙ stays: settings are the way back to everything else. It stacks over the toggle.
         (macOS has no rail head: its buttons are in the title bar, below.) */
      body.railCollapsed .railHead { padding: 12px 0 8px; flex-direction: column; justify-content: center; }
      .railHead {
        padding: 10px 10px 6px 10px; color: var(--muted);
        display: flex; align-items: center; gap: 2px;
      }
      /* 14px in and 2px down from the window's corner: at 10px and 0 the ⚙ looked about to be cut by the frame. */
      body:not(.railCollapsed) .railHead { height: var(--topBar); padding: 2px 10px 0 14px; }
      /* The empty middle of the head: what the window is dragged by. */
      .railDrag { flex: 1; align-self: stretch; }
      .railTabs { display: flex; gap: 4px; margin-top: 4px; }
      #usageBar {
        display: flex; align-items: center; gap: 4px; padding: 0 10px 4px;
        font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
      }
      #usageBar[hidden] { display: none; }
      #usageText { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 3px 12px; }
      #usageText.off { opacity: .7; }
      #usageText.stacked { flex-direction: column; align-items: flex-start; }
      .usageGroup { display: inline-flex; align-items: center; gap: 7px; }
      .usageAgent { font-weight: 600; font-size: 10.5px; min-width: 42px; }
      .usageAgent.claude { color: var(--live); }
      .usageAgent.codex { color: var(--link); }
      .usageAgent.agy { color: var(--muted); }
      .usageItem { display: inline-flex; align-items: center; gap: 3px; cursor: default; }
      .usageWindow { color: var(--dim); font-size: 9.5px; }
      /* Five cells in a body with a nub, filled from the left. */
      .battery {
        position: relative; display: inline-flex; gap: 1px; padding: 1px;
        border: 1px solid var(--muted); border-radius: 2px; margin-right: 2px;
      }
      .battery::after {
        content: ""; position: absolute; right: -3px; top: 2px; width: 2px; height: 3px;
        background: var(--muted); border-radius: 0 1px 1px 0;
      }
      .battery i { width: 3px; height: 5px; border-radius: 1px; background: transparent; transform-origin: left; }
      .battery.ok i.full { background: var(--go); }
      .battery.low i.full { background: var(--live); }
      .battery.out i.full { background: var(--stop); }
      /* A chevron like VS Code's section headers: down folds it away, up brings it back. */
      #usageToggle { display: inline-flex; align-self: flex-start; padding: 1px; margin-left: -4px; }
      .railTabs .railBtn { flex: 1; text-align: center; padding: 6px 4px; }
      .railTabs .railTab {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 8px 6px; border: 1px solid var(--line); color: var(--text);
        font-size: 12.5px; font-weight: 600; position: relative;
      }
      /* One line or none: fitRailTabs drops the words (iconOnly) before they would wrap. */
      .railTabs .railTab { white-space: nowrap; overflow: hidden; min-width: 0; }
      .railTabs.iconOnly .railTab > [data-i18n] { display: none; }
      .railTabs .railTab:hover { border-color: var(--muted); }
      .railTabs .railTab.on { border-color: var(--live); }
      .railTabIcon { flex: none; }
      #railToggle {
        border: 0; background: none; color: var(--muted); cursor: pointer;
        font-size: 12px; padding: 2px 7px; border-radius: 4px; letter-spacing: 0;
      }
      #railToggle:hover { background: var(--raise); color: var(--text); }
      #workspaces { flex: 1; overflow-y: auto; padding-bottom: 8px; }
      /* A machine's folders hang off a guide line, indented under it, and a
         rule parts one machine from the next. Without them a heading in the
         same grey as the rows read as one more row, and nothing said where
         one machine's folders ended. The active row's amber edge lands on the
         guide, so the selection still reads as the folder's own marker. */
      .machine { position: relative; padding: 0 0 6px 12px; }
      .machine + .machine { border-top: 1px solid var(--line); }
      .machine::before {
        content: ""; position: absolute; left: 12px; top: 32px; bottom: 10px;
        border-left: 1px solid var(--idle);
      }
      .machine .ws { padding-left: 14px; }
      .machineHead {
        display: flex; align-items: center; gap: 8px; padding: 10px 18px 5px;
        margin-left: -12px;
        font-family: var(--sans); font-size: 10.5px; font-weight: 600; color: var(--text);
      }
      .machineHead .name {
        flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .iconBtn {
        border: 0; background: none; color: var(--muted); cursor: pointer;
        padding: 0 3px; line-height: 1; font-size: 13px; border-radius: 3px;
      }
      .iconBtn:hover { color: var(--text); background: var(--raise); }
      /* The folder row's two controls -- settings and the file list -- are
         things to hit, not marks to notice: 13px glyphs were a hunt. */
      .ws .iconBtn { font-size: 17px; padding: 4px 5px; border-radius: 4px; }
      .ws .agentTag { margin-right: 6px; font-size: 9px; padding: 0 4px; }
      .iconBtn.on { color: var(--live); }
      .ws {
        display: flex; align-items: center; gap: 9px; width: 100%;
        padding: 7px 18px 7px 18px; border: 0; border-left: 2px solid transparent;
        background: none; text-align: left; cursor: pointer;
      }
      .ws:hover { background: var(--raise); }
      /* Where a dragged folder or machine will land. */
      .dropBefore { box-shadow: inset 0 2px 0 var(--live); }
      .dropAfter { box-shadow: inset 0 -2px 0 var(--live); }
      /* A folder that takes the files dragged in from Explorer. */
      .filesOver { box-shadow: inset 0 0 0 1px var(--live); background: var(--raise); }
      .ws.active { background: var(--raise); border-left-color: var(--live); }
      .lamp {
        width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px;
        background: var(--idle);
        padding: 0; border: 0; appearance: none;
      }
      /* Live is green, the colour of a go; connecting is amber, the colour of
         on-its-way. The traffic-light reading people already have, rather than
         amber meaning both "live" and "selected" at once. */
      .lamp.live { background: var(--go); box-shadow: 0 0 0 3px color-mix(in srgb, var(--go) 18%, transparent); }
      .lamp.wait { background: var(--live); }
      @keyframes lampBreathe { 50% { opacity: .35; } }
      /* Barely there, and with its own curve: a breath has no end to arrive at,
         and --ease would make it a blink. */
      @keyframes lampWorking { 50% { opacity: .72; } }
      .lamp.stop { background: var(--stop); }
      /* A running lamp is the stop control; an idle one connects. */
      button.lamp { cursor: pointer; }
      button.lamp:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--go) 35%, transparent); }
      button.lamp.stoppable:hover,
      button.lamp.stoppable:focus-visible {
        box-shadow: 0 0 0 3px var(--stop); background: var(--stop);
      }
      /* One vocabulary for every lamp and the phone's dots (shared/status.ts):
         working breathes green, waiting is amber, done green, failed red, idle grey,
         and a hollow ring: the terminal is up, the AI in it has gone.
         A PC's lamp: live green, connecting amber, failed red, off grey. */
      .lamp[data-status="working"] { background: var(--go); animation: lampWorking 2.4s ease-in-out infinite; }
      .lamp[data-status="done"], .lamp[data-status="live"] { background: var(--go); box-shadow: 0 0 0 3px color-mix(in srgb, var(--go) 18%, transparent); }
      .lamp[data-status="waiting"] { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent); }
      .lamp[data-status="connecting"] { background: var(--live); }
      .lamp[data-status="failed"] { background: var(--stop); }
      .lamp[data-status="shellOnly"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
      .paneHeader .lamp { margin-right: 6px; }

      /* The row's actions stay out of the way until the row is pointed at or
         focused. They were all permanently visible, which made a list of
         folders read as a wall of icons. Out of the layout, not just out of
         sight: hidden but still sized, they kept the name from the width it
         could use. :focus-within and not :hover alone, or they would be
         unreachable by keyboard -- focusing the row shows them, and Tab
         moves on into them. */
      .ws .iconBtn, .machineHead .iconBtn { display: none; }
      .ws:hover .iconBtn, .ws:focus-within .iconBtn,
      .machineHead:hover .iconBtn, .machineHead:focus-within .iconBtn { display: inline-block; }
      /* Cleanup mode: a picked row is tinted and barred in the stop colour;
         the row's own buttons step aside so a click only picks. */
      .machine .ws.pickable .iconBtn, .machine .ws.pickable .treeToggle { visibility: hidden; }
      .ws.pickable button { pointer-events: none; }
      .ws.picked, .ws.picked.active { background: color-mix(in srgb, var(--stop) 10%, transparent); border-left-color: var(--stop); }
      .ws.picked:hover { background: color-mix(in srgb, var(--stop) 16%, transparent); }
      .machineHead .iconBtn.cleaning { display: inline-block; color: var(--stop); }
      .iconBtn .lucide { margin-right: 0; vertical-align: -2px; }
      .pickBar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        margin: 4px 12px 2px 2px; font-size: 11px;
      }
      .pickHint { flex: 1 0 100%; color: var(--muted); }
      .pickBar button {
        border: 1px solid var(--line); background: var(--raise); color: var(--text);
        padding: 3px 9px; border-radius: 5px; font: inherit; cursor: pointer;
      }
      .pickBar .pickRemove { flex: 1; border-color: transparent; background: var(--stop); color: #fff; }
      .pickBar .pickRemove:hover:not(:disabled) { background: color-mix(in srgb, var(--stop) 85%, #000); }
      .pickBar .pickRemove:disabled { opacity: .4; cursor: default; }
      .pickBar .pickCancel:hover { border-color: var(--muted); }
      /* A pin whose PC is off or cut off: still there, a click away from connecting. */
      .ws.offline { opacity: .5; }
      /* A worktree under its project: one step in, its branch mark before the name. */
      .machine .ws.wt { padding-left: 30px; }
      .ws.wt .wsTitle .lucide { flex: none; color: var(--muted); }
      .wtCount {
        flex: none; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none;
        color: var(--muted); font-size: 11px; padding: 2px 4px; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums;
      }
      .wtCount:hover { color: var(--text); background: var(--raise); }
      .wtCount.waiting { color: var(--live); }
      .wtCount.folded { opacity: .7; }
      .wtWarn { color: var(--live); }
      .wtClean { border: 0; background: none; padding: 0; font: inherit; color: var(--dim); cursor: pointer; text-align: left; }
      .wtClean:hover { color: var(--text); text-decoration: underline; }
      /* The PC list's own head, where the PC 관리 edit mode is switched. */
      .railListHead {
        display: flex; align-items: center; gap: 8px; padding: 10px 18px 5px;
        font-family: var(--sans); font-size: 10.5px; font-weight: 600; color: var(--muted);
      }
      .railListHead .name { flex: 1; }
      .machine + .railListHead { border-top: 1px solid var(--line); }
      .machineHead.managing .iconBtn, .railListHead .iconBtn { display: inline-block; }
      .grip { cursor: grab; color: var(--muted); }
      .machineHead > .lamp { margin-right: 2px; }
      /* An icon, not a word: a word wrapped letter by letter once the head ran short. */
      .reconnectBtn { flex: none; display: inline-grid; place-items: center; width: 22px; height: 18px; padding: 0; border-radius: 9px; border: 1px solid var(--stop); color: var(--stop); background: transparent; cursor: pointer; }
      .reconnectBtn .lucide { margin: 0; }
      .reconnectBtn svg { width: 12px; height: 12px; }
      .reconnectBtn:hover { background: color-mix(in srgb, var(--stop) 12%, transparent); }
      .autoConnect { display: flex; align-items: center; gap: 6px; padding: 2px 12px 4px 28px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
      .wsText { flex: 1; min-width: 0; }
      .wsName {
        display: block; font-size: 12.5px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      /* Two lines before the ellipsis, here and on every preview surface --
         one clipped line hid too much before the hover ever happened. */
      .wsMeta {
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        font-size: 10.5px; color: var(--muted);
        overflow: hidden; word-break: break-word;
      }
      /* A session waiting on the operator gets a dot, not a color change on
         the lamp -- the lamp is connection state, this is "your turn". The
         name turns bold and the dot follows it, where a notification badge
         sits in a chat list -- before the name it read as part of the name. */
      .wsTitle { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .ws.waiting .wsName { font-weight: 600; }
      .shareBadge { flex: none; font-size: 10px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
      .waitingDot { flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
      .railFoot { border-top: 1px solid var(--line); padding: 8px; }
      #settingsButton .lucide { margin: 0; vertical-align: -2px; }
      .railBtn {
        display: block; width: 100%; text-align: left; border: 0; background: none;
        color: var(--muted); padding: 7px 10px; border-radius: 5px; cursor: pointer;
        font-size: 12px;
      }
      .railBtn:hover { background: var(--raise); color: var(--text); }
      .railBtn[hidden] { display: none; }
      .railBtn.primary { color: var(--text); }
      .railBtn.on { color: var(--live); background: var(--raise); }
      /* With no OS title bar the rail's head is what the window is dragged
         by -- and double-clicked to maximize, right-clicked for the window
         menu, the way a title bar is (on macOS the title bar is, below). Its toggle opts back out, or it would
         stop receiving clicks at all. */
      body.frameless .railHead {
        -webkit-app-region: drag; app-region: drag; user-select: none;
      }
      body.frameless .railHead button {
        -webkit-app-region: no-drag; app-region: no-drag;
      }
      /* macOS keeps its traffic lights in the window's top-left corner, fixed
         in window points: they end about 71pt in, whatever the page's zoom.
         So the band keeps 82pt clear there, divided by the zoom main.ts
         reports (--zoom), or Cmd+- would slide « under the green light.
         There the title bar runs the
         full width as a thin band over the rail and the panes: the lights at
         its left, the rail's « » right after them as in Finder, and at its
         right the split buttons, then the phone and settings buttons moved
         over from the rail head (main.ts). The rail starts under the band, so
         collapsing it gives back its whole width instead of keeping 82px of
         corner for the lights. Full screen moves the lights into the menu bar,
         so their room is given back. */
      body.trafficLights #titleBar { position: fixed; top: 0; left: 0; right: 0; z-index: 4; padding: 0 8px 0 calc(82px / var(--zoom, 1)); }
      body.trafficLights.fullScreen #titleBar { padding-left: 8px; }
      body.trafficLights #rail { margin-top: var(--topBar); }
      body.trafficLights main { padding-top: var(--topBar); }
      body.trafficLights .railHead { display: none; }
      body.trafficLights.railCollapsed #rail { width: 0; flex-basis: 0; border-right-width: 0; }
      body.trafficLights #titleBar .railIconBtn,
      body.trafficLights #railToggle { -webkit-app-region: no-drag; app-region: no-drag; }
      body.trafficLights #titleBar .railIconBtn { width: 28px; height: 24px; padding: 0; margin: 0 2px; }
      body.railCollapsed .railDrag { display: none; }
      .railIconBtn {
        flex: 0 0 auto; border: 0; background: none; color: var(--muted); cursor: pointer;
        padding: 7px 9px; border-radius: 5px; font-size: 13px;
      }
      .railIconBtn:hover { background: var(--raise); color: var(--text); }
      /* In the 32px head a 34px button touched the frame; 5px top and bottom keeps it, and its focus ring, inside. */
      body:not(.railCollapsed) .railHead .railIconBtn { padding-top: 5px; padding-bottom: 5px; }

      /* --- main ------------------------------------------------------- */
      main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      /* One thin bar over the panes (and the map, guide and workflow), as
         tall as the rail's head so their bottoms line up (on macOS it spans
         the rail too, below): its empty space
         drags the window, and at its right end sit the split buttons, then,
         on Windows and Linux with no OS frame, the usual ─ □ ✕. */
      #titleBar { display: flex; align-items: center; height: var(--topBar); flex: 0 0 var(--topBar); }
      body:not(.winControls) #winControls { display: none; }
      .titleDrag { flex: 1; align-self: stretch; -webkit-app-region: drag; app-region: drag; }
      #titleBar .paneBtn { width: 28px; height: 24px; margin: 0 2px; -webkit-app-region: no-drag; app-region: no-drag; }
      #titleBar .paneBtn .splitIcon { vertical-align: middle; }
      #winControls { display: flex; align-self: stretch; margin-left: 6px; -webkit-app-region: no-drag; app-region: no-drag; }
      #winControls button {
        width: 46px; padding: 0; border: 0; border-radius: 0; background: none; color: var(--muted);
        font-size: 12px; cursor: pointer;
      }
      #winControls button:hover { background: var(--line); color: var(--text); }
      #winControls #winClose:hover { background: var(--stop); color: #fff; }
      /* Positioned so the zoom bar can sit over a view without being inside
         it -- a control parked in a scrolling pane scrolls away with it. */
      #contentRow { flex: 1; display: flex; min-height: 0; position: relative; }
      #zoomBar {
        position: absolute; right: 18px; bottom: 18px; z-index: 5;
        display: flex; align-items: center; gap: 2px; padding: 3px;
        border: 1px solid var(--line); border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(6px);
        opacity: .55; transition: opacity var(--t-fast) var(--ease);
      }
      /* Same cascade gotcha as #terminal above: this rule's own `display: flex`
         wins over the `[hidden]` UA default, so showView()'s zoomBar.hidden = true
         never actually hid it on Terminal/Guide views without this override. */
      #zoomBar[hidden] { display: none; }
      #zoomBar:hover { opacity: 1; }
      #zoomBar button {
        padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer;
        width: 26px; height: 24px; border-radius: 5px; font-size: 14px; line-height: 1;
      }
      #zoomBar button:hover { background: var(--raise); color: var(--text); }
      #zoomPct {
        min-width: 46px; text-align: center; font-family: var(--sans); font-variant-numeric: tabular-nums;
        font-size: 11px; color: var(--muted); user-select: none;
      }
      /* Flex items default to min-width:auto, not 0 -- without this, a
         flex item never shrinks below its content's intrinsic width (here,
         xterm's internal .xterm-screen element, which carries an explicit
         pixel width from the last fit() call). That silently never mattered
         before #workflowPanel existed as a sibling actually competing for
         the row's width. */
      #terminal { flex: 1; min-height: 0; min-width: 0; display: flex; }
      /* Setting `display` in an author rule always wins over the browser's
         own `[hidden] { display:none }` (a lower-priority UA-origin style),
         regardless of selector specificity -- without this override,
         showView()'s terminalPanel.hidden = true stopped visually hiding
         #terminal the moment it gained an explicit `display` above, and
         Map/Guide view silently lost half their width to an invisible,
         still-laid-out terminal pane. */
      #terminal[hidden] { display: none; }
      .paneSplit { display: flex; flex: 1; min-height: 0; min-width: 0; gap: 6px; padding: 6px; }
      .paneLeaf {
        flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column;
        border: 1px solid transparent; border-radius: 6px; overflow: hidden;
      }
      .paneLeaf.focused { border-color: var(--live); }
      .paneHeader, .paneTabs {
        background: var(--panel); border-bottom: 1px solid var(--line);
        font-family: var(--sans); font-size: 10.5px; color: var(--muted);
      }
      .paneHeader { flex: 0 0 24px; display: flex; align-items: center; padding: 0 8px; user-select: none; }
      .paneHeader.movable { cursor: grab; }
      /* A 2px band across the top, one colour per project; inset, so no size changes. */
      .paneHeader { --band-l: 58%; box-shadow: inset 0 2px 0 hsl(var(--band-h, 0) 65% var(--band-l) / var(--band-a, 0)); }
      .paneHeader[style*="--band-h"] { --band-a: 1; }
      :root[data-theme="light"] .paneHeader { --band-l: 42%; }
      /* The name takes what the buttons leave, and gives way first: buttons keep their size and their one line. */
      .paneHeader .name { flex: 1 1 auto; min-width: 2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px; }
      .paneHeader .paneBtn { flex-shrink: 0; white-space: nowrap; }
      /* The tab row under the head; positioned so a tab's offsetLeft counts from here. */
      .paneTabs { flex: 0 0 22px; position: relative; display: flex; overflow-x: auto; scrollbar-width: none; }
      .paneTab {
        flex: 0 1 auto; min-width: 4em; max-width: 14em; display: flex; align-items: center; gap: 4px;
        border: 0; border-right: 1px solid var(--line); background: none; color: var(--muted);
        font: inherit; padding: 0 6px; cursor: pointer;
      }
      .paneTab.shown { color: var(--text); background: var(--ground); }
      /* One per strip, moved by main.ts showTabsMoved: amber where typing goes. */
      .tabInk { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--muted); pointer-events: none; }
      .paneLeaf.focused .tabInk { background: var(--live); }
      /* A closed tab, for the moment its width goes. */
      .paneTab.tabGhost { flex: none; min-width: 0; overflow: hidden; white-space: nowrap; pointer-events: none; }
      .paneTab .tabName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .paneTab.dirty .tabName::before { content: "● "; color: var(--live); }
      .paneTab.attention .tabName { color: var(--live); }
      .paneTab .tabClose { opacity: 0; padding: 0 2px; border-radius: 3px; }
      .paneTab:hover .tabClose, .paneTab.shown .tabClose { opacity: 1; }
      .paneTab .tabClose:hover { background: var(--raise); color: var(--text); }
      /* `.fileOverlay { display: flex }` beats the UA [hidden] rule, so a hidden
         tab's overlay stayed on screen. Invisible, not display:none: the frame keeps painting. */
      .fileOverlay[hidden] { visibility: hidden; }
      /* Overlays sit above the panes (z-index 4): see-through while dragging, so the zone marks and messages below show. */
      #terminal.tabDragging ~ .fileOverlay { pointer-events: none; opacity: .4; }
      #terminal.tabDragging .paneLeaf { position: relative; }
      /* No hover tip mid-drag: the drop rebuilds the head, and a tip whose name is gone never hears the pointer leave. */
      #terminal.tabDragging .paneHeader .name { pointer-events: none; }
      #terminal.tabDragging .paneLeaf.dropOk { border-color: var(--link); }
      #terminal.tabDragging .paneLeaf.dropDenied, #terminal.tabDragging .paneLeaf.dragSource { opacity: .45; }
      #terminal.tabDragging .paneLeaf[data-denied]:not([data-denied=""])::after {
        content: attr(data-denied); position: absolute; z-index: 5; inset: auto 8px 8px 8px; text-align: center;
        font-size: 11.5px; color: var(--text); background: var(--panel); border-radius: 6px; padding: 6px;
      }
      /* Where the tab would go, drawn over the pane and its file (z-index 5 > 4): the
         whole pane to join it, its right or bottom quarter to split off there. */
      #terminal.tabDragging .paneLeaf:not([data-zone=""])[data-zone]::before {
        content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none; border-radius: 6px;
        border: 2px solid var(--link); background: color-mix(in srgb, var(--link) 18%, transparent);
      }
      #terminal.tabDragging .paneLeaf[data-zone="right"]:not([data-zone=""])::before { left: var(--dropEdge, 75%); }
      #terminal.tabDragging .paneLeaf[data-zone="bottom"]:not([data-zone=""])::before { top: var(--dropEdge, 75%); }
      /* A project from the rail gets all four edges, and shows the half its new pane takes. */
      #terminal.projectDragging { --dropEdge: 50%; }
      #terminal.tabDragging .paneLeaf[data-zone="left"]:not([data-zone=""])::before { right: var(--dropEdge); }
      #terminal.tabDragging .paneLeaf[data-zone="top"]:not([data-zone=""])::before { bottom: var(--dropEdge); }
      .paneBtn {
        border: 0; background: none; color: var(--muted); cursor: pointer;
        padding: 0 4px; line-height: 1; font-size: 11px; border-radius: 3px; margin-left: 2px;
      }
      .paneBtn:hover { color: var(--text); background: var(--raise); }
      .paneBtn:disabled { opacity: .35; cursor: default; background: none; color: var(--muted); }
      .paneHandle { flex: 0 0 auto; background: transparent; }
      /* One pane zoomed: everything else in the layout steps aside, kept as it was. */
      #terminal.zoomed .paneLeaf:not(.zoomed), #terminal.zoomed .paneHandle,
      #terminal.zoomed .paneSplit:not(:has(.zoomed)) { display: none; }
      /* A pane opening or closing, for the moment it moves (main.ts movePanes). */
      #terminal.panesMoving { position: relative; }
      #terminal.panesMoving .paneLeaf { position: absolute; }
      #terminal.panesMoving .paneHandle { visibility: hidden; }
      .paneDivider { position: absolute; z-index: 5; pointer-events: none; background: var(--muted); }
      .paneHandle-row { width: 6px; cursor: col-resize; }
      .paneHandle-column { height: 6px; cursor: row-resize; }
      .paneHandle:hover { background: var(--line); }
      .paneSlot { flex: 1; min-height: 0; padding: 4px 6px 6px; }
      /* Why this session is not running, over its terminal. */
      .paneSlot.noted { display: flex; flex-direction: column; gap: 8px; }
      .paneSlot.noted > :last-child { flex: 1; min-height: 0; }
      .sessionNote { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; }
      .sessionNote button { padding: 5px 10px; border-radius: 5px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; }
      /* An empty or stopped pane's message, centred over it: text, then buttons. */
      .paneSlot { position: relative; }
      /* A pane smaller than a split would allow, after the window shrank. */
      .paneSlot.tooSmall::after {
        content: attr(data-small); position: absolute; right: 8px; bottom: 6px; z-index: 2; pointer-events: none;
        padding: 2px 7px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line);
        font-family: var(--sans); font-size: 10.5px; color: var(--muted);
      }
      .paneMessage {
        position: absolute; inset: 0; z-index: 1; background: var(--ground);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .paneMessage p { max-width: 46ch; margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
      .paneMessage .row { margin-top: 14px; justify-content: center; }
      .paneMessage .row button { flex: none; padding: 7px 16px; }
      .paneMessage .row button.go { background: var(--live); border-color: var(--live); color: #21160a; font-weight: 600; }
      #map, #guide { flex: 1; min-height: 0; min-width: 0; overflow: auto; position: relative; }
      /* The title bar's "확인 필요 n": opens the workflow map on the next waiting session. */
      .wmPill {
        height: 22px; margin: 0 6px; padding: 0 10px; border-radius: 11px; cursor: pointer;
        border: 1px solid color-mix(in srgb, var(--live) 55%, transparent);
        background: color-mix(in srgb, var(--live) 14%, transparent); color: var(--live);
        font-size: 11.5px; font-weight: 600; -webkit-app-region: no-drag; app-region: no-drag;
      }
      .wmPill[hidden] { display: none; }
      #workflow { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden; background: var(--ground); }
      /* --- the workflow map (workflowmap/): a canvas with its strip, zoom bar,
         focus bar and right panel over it. Every colour is a theme variable:
         the canvas reads the same ones (paint.ts themeFrom). */
      .wmCanvas { position: absolute; inset: 0; display: block; touch-action: none; }
      .wmCanvas.grab { cursor: grabbing; }
      .wmStrip {
        position: absolute; left: 0; right: 0; top: 0; height: 44px; z-index: 2;
        display: flex; align-items: center; gap: 12px; padding: 0 14px;
        background: color-mix(in srgb, var(--ground) 88%, transparent); border-bottom: 1px solid var(--line);
        backdrop-filter: blur(6px);
      }
      .wmCrumb { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .wmCrumb b { color: var(--text); font-weight: 650; }
      .wmCrumb i { font-style: normal; margin: 0 6px; color: var(--dim); }
      .wmNeedBox { position: relative; flex: none; }
      .wmNeed {
        display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 11px; border-radius: 13px; cursor: pointer;
        border: 1px solid color-mix(in srgb, var(--live) 55%, transparent);
        background: color-mix(in srgb, var(--live) 14%, transparent); color: var(--live); font-weight: 650; font-size: 12.5px;
      }
      .wmNeedN {
        display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
        background: var(--live); color: var(--ground); font-size: 11px; font-weight: 700;
      }
      .wmNeedList {
        position: absolute; top: 32px; left: 0; z-index: 5; min-width: 280px; margin: 0; padding: 6px; list-style: none;
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .45);
      }
      .wmNeedList[hidden] { display: none; }
      .wmNeedItem { display: grid; grid-template-columns: 14px 1fr; column-gap: 6px; width: 100%; padding: 7px 8px; border: 0; border-radius: 7px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; align-items: center; }
      .wmNeedItem:hover, .wmNeedItem:focus-visible { background: var(--raise); }
      .wmNeedList li.none { padding: 7px 8px; color: var(--muted); }
      .wmNeedList small { grid-column: 2; color: var(--muted); font-size: 11.5px; }
      .wmSum { display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
      .wmSum b { color: var(--text); font-weight: 700; margin-left: 2px; }
      .wmSum .work b { color: var(--go); }
      .wmSp { flex: 1; }
      .wmTog {
        display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; cursor: pointer;
        border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12.5px; white-space: nowrap;
      }
      .wmTog.on { color: var(--go); border-color: color-mix(in srgb, var(--go) 55%, transparent); background: color-mix(in srgb, var(--go) 12%, transparent); }
      .wmTog.on::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--go); }
      .wmZoom {
        position: absolute; left: 14px; top: 58px; z-index: 2; display: flex; align-items: center; height: 30px; padding: 0 4px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      }
      .wmZoom button { width: 26px; height: 24px; border: 0; background: none; border-radius: 5px; color: var(--text); font-size: 16px; line-height: 1; cursor: pointer; }
      .wmZoom button:hover { background: var(--raise); }
      .wmPct { min-width: 44px; text-align: center; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; user-select: none; }
      .wmFocus {
        position: absolute; left: 14px; top: 98px; z-index: 2; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 6px 0 12px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; color: var(--muted);
      }
      .wmFocus[hidden] { display: none; }
      .wmFocus b { color: var(--text); }
      .wmFocusBack { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 6px; color: var(--text); }
      .wmFocusBack:hover { background: var(--raise); }
      .wmFocus kbd { font: 600 10.5px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
      .wmEmpty { position: absolute; left: 0; right: 0; top: 50%; text-align: center; color: var(--muted); font-size: 12.5px; }
      .wmEmpty[hidden] { display: none; }
      /* The right panel: summary card first, then the step list. */
      .wmPanel {
        position: absolute; top: 52px; right: 8px; bottom: 8px; width: 360px; z-index: 3; display: flex; flex-direction: column;
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .45);
      }
      .wmPanel[hidden] { display: none; }
      .wmPanel .ph { display: flex; gap: 12px; align-items: flex-start; padding: 16px 16px 12px; }
      .wmPanel .av { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; background: var(--raise); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
      .wmPanel .phT { flex: 1; min-width: 0; }
      .wmPanel .pt { font-size: 15px; font-weight: 700; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .wmPanel .ps { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      .wmPanel .close { flex: none; border: 0; background: none; color: var(--muted); font-size: 14px; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; }
      .wmPanel .close:hover { background: var(--raise); color: var(--text); }
      .wmPanel .pb { flex: 1; overflow: auto; padding: 0 16px 16px; }
      .wmPanel .stateNote { margin-bottom: 10px; font-size: 12px; color: var(--stop); }
      .wmPanel .sum { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--ground); display: grid; gap: 8px; }
      .wmPanel .sumH { font-size: 12px; color: var(--muted); font-weight: 600; }
      .wmPanel .sr { display: grid; grid-template-columns: 38px 1fr; gap: 8px; font-size: 13px; line-height: 1.5; }
      .wmPanel .sk { color: var(--muted); font-size: 12px; padding-top: 1px; }
      .wmPanel .sv { min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
      .wmPanel .sv.strong { font-weight: 650; }
      .wmPanel .sv.muted { color: var(--muted); }
      .wmPanel .goal { white-space: pre-wrap; }
      .wmPanel .goal.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .wmPanel .more { display: block; margin-top: 2px; padding: 0; border: 0; background: none; color: var(--link); font-size: 12px; cursor: pointer; }
      .wmPanel .ago { color: var(--muted); font-weight: 400; font-size: 12px; }
      .wmPanel .mono { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 400; }
      .wmPanel .q { margin-top: 12px; border: 1px solid color-mix(in srgb, var(--live) 55%, transparent); background: color-mix(in srgb, var(--live) 10%, transparent); border-radius: 12px; padding: 12px 14px; }
      .wmPanel .qh { color: var(--live); font-weight: 650; font-size: 12px; }
      .wmPanel .qt { margin-top: 8px; font-weight: 700; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
      .wmPanel .qo { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
      .wmPanel .qo li { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 600; cursor: default; }
      .wmPanel .qo li b { width: 12px; flex: none; }
      .wmPanel .qo li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .wmPanel .qo small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
      .wmPanel .qn { margin-top: 10px; font-size: 12px; color: var(--muted); }
      .wmPanel .steps { margin-top: 14px; }
      .wmPanel .cap { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
      .wmPanel .sec { margin: 16px 0 4px; font-size: 12px; color: var(--muted); }
      .wmPanel .secH { margin: 18px 0 8px; font-size: 13px; color: var(--muted); }
      .wmPanel .secH b { color: var(--text); margin-right: 6px; }
      .wmPanel .log, .wmPanel .flist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      .wmPanel .log li { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; font-size: 13px; line-height: 1.5; }
      .wmPanel .log .k { color: var(--muted); font-weight: 600; font-size: 12px; }
      .wmPanel .log .k.run { color: var(--go); }
      .wmPanel .log .tx { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .wmPanel .tm { font-size: 12px; color: var(--muted); white-space: nowrap; }
      .wmPanel .flist { gap: 2px; }
      .wmPanel .flist li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
      .wmPanel .flist .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .wmPanel .go { padding: 12px 16px; border-top: 1px solid var(--line); }
      .wmPanel .goBtn { width: 100%; height: 36px; border-radius: 9px; border: 0; background: var(--text); color: var(--ground); font-weight: 650; cursor: pointer; }
      .wmPanel .goBtn span { margin-left: 4px; }
      /* The panel's step list shows whole steps, as the old full-width detail did. */
      .wmPanel .wfStep { font-size: 12px; padding: 5px 0 5px 2px; }
      .wmPanel .wfStep .x { display: block; white-space: normal; overflow: visible; }
      /* Status dots in the DOM, as the rail's lamps colour them. */
      .wmDot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
      .wmDot.working { background: var(--go); }
      .wmDot.waiting { background: transparent; box-shadow: inset 0 0 0 2px var(--live); }
      .wmDot.done { background: transparent; box-shadow: inset 0 0 0 1.5px var(--go); }
      .wmDot.failed { background: var(--stop); }

/* --- dialogs ---------------------------------------------------- */
      dialog {
        background: var(--panel); color: var(--text); border: 1px solid var(--line);
        border-radius: 10px; padding: 20px 22px;
        /* Never wider than the window: a fixed 460px overflowed once the
           window shrank below it (min window width is 720, but the content
           row shares that with the rail). */
        width: min(460px, calc(100vw - 48px));
      }
      dialog::backdrop { background: #05080ccc; }
      /* The one entrance: a short rise and a fade, on `translate` so it never fights an element's own transform. */
      @keyframes rise { from { opacity: 0; translate: 0 8px; } }
      @keyframes fadeIn { from { opacity: 0; } }
      dialog[open]:not(.tour) { animation: rise var(--t-mid) var(--ease); }
      dialog[open]:not(.tour)::backdrop { animation: fadeIn var(--t-mid) var(--ease); }
      #phoneToast:popover-open { animation: rise var(--t-mid) var(--ease); }
      #phoneDialog, #relayDialog { max-height: calc(100vh - 48px); overflow-y: auto; }
      #phoneDialog, #relayDialog { width: min(560px, calc(100vw - 48px)); }
      #relayDialog h3 { margin: 4px 0 6px; font-size: 13.5px; }
      #relayDialog h2 { display: flex; align-items: center; }
      #setupProgress { margin-left: auto; color: var(--muted); font: 500 12px var(--sans); }
      /* Fills as the walk goes on; the element stays, so a CSS transition carries it. */
      #setupTrack { height: 2px; margin: 8px 0 12px; border-radius: 1px; background: var(--line); overflow: hidden; }
      #setupFill { display: block; height: 100%; background: var(--live); transform: scaleX(0); transform-origin: left; transition: transform var(--t-mid) var(--ease); }
      /* While two steps cross: no scrollbars for the moment one sticks out. */
      #relayDialog.sliding { overflow: hidden; }
      /* Drawn once as the closing page comes up. */
      .setupCheck { width: 18px; height: 18px; margin-right: 6px; vertical-align: -3px; fill: none; stroke: var(--go); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .setupCheck path { stroke-dasharray: 1; animation: drawCheck var(--t-slow) var(--ease); }
      @keyframes drawCheck { from { stroke-dashoffset: 1; } }
      .phoneStep { min-height: 150px; }
      .phoneStep[hidden] { display: none; }
      .phoneQr { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
      .phoneQr img { width: 132px; height: 132px; border-radius: 6px; background: #fff; flex: none; }
      .phoneQr img[hidden] { display: none; }
      .phoneLine { display: flex; gap: 8px; margin-top: 12px; }
      .phoneLine button {
        flex: none; padding: 6px 10px; border-radius: 5px; cursor: pointer;
        border: 1px solid var(--line); background: var(--raise);
      }
      #setupTotpKey { display: block; margin-top: 6px; font: 12px var(--mono); user-select: all; }
      #setupTotpBox[hidden], #setupTotpDone[hidden], #setupPasswordKept[hidden] { display: none; }
      #setupAppOpen { margin-top: 10px; }
      #phoneStatus { user-select: text; }
      #relayDialog .phoneQr img { width: 200px; height: 200px; }
      #relayScan[hidden], #relayConfirm[hidden], #relayDialog button[hidden] { display: none; }
      #relayCode { display: block; margin: 12px 0; text-align: center; font: 600 32px var(--mono); letter-spacing: 6px; }
      #settingsPanel .setAdvanced { max-width: 440px; margin-top: 18px; }
      #settingsPanel .setAdvanced summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
      #settingsPanel .setAdvanced input[type="text"] {
        display: block; width: 100%; box-sizing: border-box; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line);
        border-radius: 8px; background: var(--ground); color: var(--text); font: 13px var(--mono);
      }
      #settingsPanel .setAdvanced input[type="text"]:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
      #phoneButton .lucide { margin: 0; vertical-align: -2px; }
      #phoneButton.failed { color: var(--stop); }
      #phoneButton.waiting { color: var(--live); }
      #phoneButton.signedIn { color: var(--go); }
      /* Lucide icons beside a label: centred on the text, a small gap after. */
      .lucide { display: inline-flex; vertical-align: -3px; margin-right: 6px; }
      #phoneToast {
        position: fixed; inset: auto auto 24px 50%; margin: 0; transform: translateX(-50%);
        background: var(--panel); color: var(--text); border: 1px solid var(--live); border-radius: 8px;
        padding: 8px 14px; font-size: 12.5px; box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .55);
      }
      #phoneToast[hidden] { display: none; }

      /* --- product tour (tour.ts): the dim is the lit box's own shadow, so
         one element both darkens the screen and leaves the hole, and moving
         it is a transition rather than a redraw. */
      dialog.tour {
        position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; max-height: none;
        margin: 0; padding: 0; border: 0; background: transparent; overflow: hidden;
      }
      dialog.tour::backdrop { background: transparent; }
      .tourLight {
        position: absolute; border-radius: 8px; pointer-events: none;
        box-shadow: 0 0 0 200vmax rgba(5, 8, 12, .62);
        transition: left var(--t-slow) var(--ease), top var(--t-slow) var(--ease), width var(--t-slow) var(--ease), height var(--t-slow) var(--ease);
      }
      .tourLight::after {
        content: ""; position: absolute; inset: -2px; border-radius: 10px;
        border: 2px solid var(--live); animation: tourPulse 1.6s ease-out infinite;
      }
      dialog.tour.centered .tourLight::after { display: none; }
      @keyframes tourPulse {
        0% { opacity: .95; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.08); }
      }
      .tourCard {
        position: absolute; width: min(320px, calc(100vw - 24px));
        background: var(--panel); color: var(--text); border: 1px solid var(--line);
        border-radius: 10px; padding: 16px 18px 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
        opacity: 0; transform: translateY(8px); transition: opacity var(--t-mid) var(--ease), transform var(--t-mid) var(--ease);
      }
      .tourCard.in { opacity: 1; transform: none; }
      .tourCard h3 { margin: 0 0 6px; font-size: 14px; }
      .tourCard p { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); white-space: pre-line; }
      .tourFoot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
      .tourFoot span { margin-right: auto; }
      .tourFoot button {
        border: 1px solid var(--line); background: var(--raise); color: var(--text);
        border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer;
      }
      .tourFoot button.go { background: var(--live); border-color: var(--live); color: #11161d; }
      /* --- file preview: an overlay pinned to one pane, not a popup or a
         view of its own -- left/top/width/height are pushed by
         positionPreviewOverlay() to track that pane's own rect, so a split
         layout keeps every other pane visible underneath it. */
      /* A file open in a pane, laid over the pane's slot from outside the pane
         tree (see positionFileOverlays in main.ts), and hidden along with the
         terminal panel when another view is up. */
      .fileOverlay {
        position: absolute; z-index: 4; display: flex; flex-direction: column;
        background: var(--ground); overflow: hidden;
      }
      #terminal[hidden] ~ .fileOverlay { display: none; }
      .fileOverlay > .note { margin: 14px 16px; display: flex; align-items: center; gap: 10px; }
      .fileOverlay > .note .railBtn { width: auto; }
      .fileFrame { flex: 1; min-height: 0; width: 100%; border: 0; background: var(--ground); }
      .fileFrame.page { background: #fff; }
      #importDialog { width: min(640px, 92vw); }
      /* Settings: one tab per setting down the left, the setting on the right. */
      #settingsDialog { width: min(860px, 92vw); height: min(560px, 86vh); padding: 0; }
      #settingsDialog[open] { display: flex; flex-direction: column; }
      #settingsTitle { padding: 16px 22px 10px; margin: 0; border-bottom: 1px solid var(--line); }
      .settingsBody { flex: 1; min-height: 0; display: flex; }
      #settingsNav {
        flex: 0 0 180px; overflow-y: auto; padding: 8px 0;
        border-right: 1px solid var(--line); display: flex; flex-direction: column;
      }
      #settingsNav button {
        text-align: left; border: 0; border-left: 2px solid transparent; background: none;
        color: var(--muted); padding: 8px 16px; font-size: 12.5px; cursor: pointer;
      }
      #settingsNav button:hover { background: var(--raise); color: var(--text); }
      #settingsNav button.active { background: var(--raise); border-left-color: var(--live); color: var(--text); }
      #settingsPanel { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 22px; font-size: 13px; }
      #settingsPanel h3 { margin: 0 0 4px; font-size: 14px; }
      #settingsPanel .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
      /* Each choice is a quiet card; the picked one wears the accent. The
         radio dot and check mark are drawn here, not by the OS. */
      #settingsPanel label {
        display: flex; align-items: center; gap: 10px; max-width: 440px; margin: 6px 0; padding: 9px 12px;
        border: 1px solid var(--line); border-radius: 8px; background: var(--ground);
        color: var(--text); font-size: 13px; cursor: pointer; transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
      }
      #settingsPanel label:hover { border-color: var(--muted); }
      #settingsPanel label:has(input:checked) { border-color: var(--live); background: color-mix(in srgb, var(--live) 9%, var(--ground)); }
      #settingsPanel label:has(input:focus-visible) { outline: 2px solid var(--live); outline-offset: 2px; }
      #settingsPanel input:focus-visible { outline: none; }
      #settingsPanel .setButtons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      #settingsPanel .setPetDelete {
        margin-left: auto; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
        border: 1px solid var(--line); background: var(--raise); color: var(--muted);
      }
      #settingsPanel .setPetDelete:hover { border-color: var(--muted); color: var(--text); }
      #settingsPanel .setButtons button {
        padding: 7px 12px; border-radius: 5px; cursor: pointer;
        border: 1px solid var(--line); background: var(--raise);
      }
      #settingsPanel .setButtons button:hover { border-color: var(--muted); }
      #settingsPanel .setButtons button.go { background: var(--live); border-color: var(--live); color: #21160a; font-weight: 600; }
      #settingsPanel select {
        display: block; width: 100%; max-width: 440px; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line);
        border-radius: 8px; background: var(--ground); color: var(--text); font-size: 13px; cursor: pointer;
      }
      #settingsPanel select:hover { border-color: var(--muted); }
      #settingsPanel select:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
      #settingsPanel .setStepper { display: flex; align-items: center; gap: 8px; margin: 6px 0 14px; }
      #settingsPanel .setStepper .setButtons { margin-top: 0; }
      #settingsPanel .setStepper output { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
      /* The AI accounts tab: PCs as pills wearing their rail lamp, then one
         card row per AI -- name, state badge, its one button on the right. */
      #settingsPanel .setChips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
      #settingsPanel .setChips:empty { display: none; }
      #settingsPanel .setChips button {
        display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--line); background: var(--ground); color: var(--text); font-size: 12.5px;
      }
      #settingsPanel .setChips button:hover { border-color: var(--muted); }
      #settingsPanel .setChips button[aria-pressed="true"] { border-color: var(--live); background: color-mix(in srgb, var(--live) 9%, var(--ground)); }
      #settingsPanel .setAccount {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px; max-width: 440px; margin: 6px 0; padding: 9px 12px;
        border: 1px solid var(--line); border-radius: 8px; background: var(--ground);
      }
      #settingsPanel .setAccount .setButtons { margin: 0 0 0 auto; }
      #settingsPanel .setAccount .setMoney { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
      #settingsPanel .setAccount .setButtons button { padding: 5px 12px; }
      #settingsPanel .setBadge {
        padding: 2px 8px; border-radius: 999px; font-size: 11px; color: var(--muted);
        border: 1px solid var(--line); background: var(--panel);
      }
      #settingsPanel .setBadge.good { color: var(--go); border-color: color-mix(in srgb, var(--go) 40%, var(--line)); }
      #settingsPanel .setBadge.bad { color: var(--stop); border-color: color-mix(in srgb, var(--stop) 40%, var(--line)); }
      #settingsPanel .setNote { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 12px; }
      /* 내 API 키: a row per key, then the form that adds one. */
      #settingsPanel .setKeyLogo { display: inline-flex; }
      #settingsPanel .setKeyLogo svg, #settingsPanel .setKeyForm .setChips svg { width: 16px; height: 16px; flex: none; }
      #settingsPanel .setAccount .setLink { margin-left: auto; }
      #settingsPanel .setKeyForm { display: flex; flex-direction: column; gap: 10px; max-width: 440px; margin: 18px 0 0; }
      #settingsPanel .setKeyForm .setButtons { margin: 0; }
      #settingsPanel .setKeyForm .setLink { align-self: flex-start; }
      #settingsPanel .setKeyFields { display: flex; flex-wrap: wrap; gap: 8px; }
      #settingsPanel .setKeyFields input { flex: 1 1 160px; min-width: 0; }
      #settingsPanel .setKeyFields .setButtons { margin: 0; }
      #settingsPanel .setKeyFull { font-family: var(--mono); color: var(--text); white-space: normal; word-break: break-all; user-select: text; flex-basis: 100%; order: 9; }
      #settingsPanel .setEye { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
      #settingsPanel .setEye svg { width: 15px; height: 15px; }
      #settingsPanel .setAccount .setEye { margin-left: auto; }
      #settingsPanel .setAccount .setEye ~ .setLink { margin-left: 0; }
      #settingsPanel .setEye:hover, #settingsPanel .setEye[aria-pressed="true"] { color: var(--text); border-color: var(--muted); }
      /* Usage chart: the phone's (home.tsx UsdBars) -- a week of stacked bars under a dashed line at the axis top. */
      #settingsPanel .setChart { margin: 0 0 16px; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 10px; }
      #settingsPanel .setChartHead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
      #settingsPanel .setChartNote { flex: 1; color: var(--live); }
      #settingsPanel .setChartHead strong { font-weight: 600; font-variant-numeric: tabular-nums; }
      #settingsPanel .setChartPlot { display: flex; height: 140px; }
      #settingsPanel .setChartAxis { position: relative; width: 52px; flex: none; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      #settingsPanel .setChartAxis span { position: absolute; left: 0; transform: translateY(-50%); }
      #settingsPanel .setChartBars { flex: 1; display: flex; align-items: flex-end; gap: 8px; border-top: 1px dashed var(--muted); border-bottom: 1px solid var(--line);
        background: linear-gradient(var(--line), var(--line)) 0 50% / 100% 1px no-repeat; }
      #settingsPanel .setChartBar { flex: 1; display: flex; flex-direction: column-reverse; min-height: 2px; border-radius: 5px 5px 0 0; overflow: hidden; }
      #settingsPanel .setChartBar i { display: block; min-height: 1px; }
      #settingsPanel .setChartBar i + i { border-bottom: 2px solid var(--ground); }
      #settingsPanel .setChartNone { flex: 1; align-self: flex-end; padding-bottom: 4px; text-align: center; color: var(--muted); font-size: 11px; }
      #settingsPanel .setButtons + .setChips { margin-top: 12px; }
      #settingsPanel .setChartDays { display: flex; gap: 8px; margin: 6px 0 0 52px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      #settingsPanel .setChartDays span { flex: 1; text-align: center; }
      #settingsPanel .setChartDays .peak { color: var(--text); font-weight: 600; }
      #settingsPanel .setChartLegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; color: var(--muted); font-size: 11px; }
      #settingsPanel .setChartLegend span { display: inline-flex; align-items: center; gap: 6px; }
      #settingsPanel .setChartLegend i { width: 8px; height: 8px; border-radius: 2px; }
      #settingsPanel .setNote.bad { color: var(--stop); }
      /* 원격 PC 관리: a count line, then one card per PC -- lamp, name and
         address as one button that opens its details, a switch, and ⋯. */
      #settingsPanel .setSummary { display: flex; align-items: center; gap: 12px; max-width: 440px; color: var(--muted); font-size: 12px; }
      #settingsPanel .setLink { border: 0; background: none; padding: 2px 0; color: var(--link); font-size: 12px; cursor: pointer; }
      #settingsPanel .setSummary .setLink { margin-left: auto; color: var(--muted); }
      #settingsPanel .setLink:hover { color: var(--text); text-decoration: underline; }
      #settingsPanel .setRemoteMain {
        flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
        border: 0; background: none; padding: 0; text-align: left; cursor: pointer;
      }
      #settingsPanel .setRemoteMain strong { white-space: nowrap; }
      #settingsPanel .setMuted { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #settingsPanel .setRemote .setNote p { margin: 6px 0 0; }
      #settingsPanel .setRemote .setNote .setLink { margin-top: 4px; }
      #settingsPanel .setSwitch {
        position: relative; flex: none; width: 34px; height: 20px; padding: 0; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--line); background: var(--idle); transition: background var(--t-fast) var(--ease);
      }
      #settingsPanel .setSwitch::before {
        content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
        background: var(--ground); transition: transform var(--t-fast) var(--ease);
      }
      #settingsPanel .setSwitch[aria-checked="true"] { background: var(--go); border-color: var(--go); }
      #settingsPanel .setSwitch[aria-checked="true"]::before { transform: translateX(14px); }
      #settingsPanel .setSpinner {
        flex: none; width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid var(--live-dim); border-top-color: var(--live); animation: setSpin .8s linear infinite;
      }
      @keyframes setSpin { to { transform: rotate(360deg); } }
      #settingsPanel .setMore { position: relative; flex: none; }
      #settingsPanel .setIcon {
        width: 26px; height: 26px; padding: 0; border-radius: 5px; border: 1px solid transparent;
        background: none; color: var(--muted); cursor: pointer;
      }
      #settingsPanel .setIcon:hover, #settingsPanel .setIcon[aria-expanded="true"] { border-color: var(--line); background: var(--raise); color: var(--text); }
      #settingsPanel .setMenu {
        position: absolute; right: 0; top: calc(100% + 4px); z-index: 2; min-width: 140px; padding: 4px;
        display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel); box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
      }
      #settingsPanel .setMenu[hidden] { display: none; }
      #settingsPanel .setMenu button {
        border: 0; background: none; padding: 7px 10px; border-radius: 5px; text-align: left; font-size: 12.5px; cursor: pointer;
      }
      #settingsPanel .setMenu button:hover, #settingsPanel .setMenu button:focus-visible { background: var(--raise); }
      #settingsPanel .setMenu button.danger { color: var(--stop); border-top: 1px solid var(--line); border-radius: 0 0 5px 5px; margin-top: 4px; }
      #settingsPanel ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
      #importList { max-height: 52vh; overflow-y: auto; overflow-x: hidden; margin: 4px 0 10px; }
      #importList h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
      .importRow { display: flex; align-items: center; gap: 8px; padding: 3px 4px; font-size: 12.5px; cursor: pointer; }
      .importRow.child { padding-left: 28px; font: 11.5px var(--sans); }
      .importRow.known { opacity: .5; cursor: default; }
      .importRow .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .importRow .meta { margin-left: auto; padding-left: 12px; color: var(--muted); font-size: 11px; white-space: nowrap; }
      #importNote { white-space: pre-line; }
      /* The agent picker and the in-app dialog focus the likely choice by
         hand; a mouse-opened dialog would otherwise not show which one Enter
         takes. */
      #askDialog .row button:focus { outline: 2px solid var(--live); outline-offset: 2px; }
      .resumeOpt { display: flex; align-items: center; gap: 6px; margin: 0 0 12px; font-size: 12px; color: var(--muted); cursor: pointer; }
      .resumeOpt[hidden] { display: none; }
      /* The agent picker: the agents as equal tiles with their marks, and
         everything else quiet around them -- one line of choices, a footer
         for the plain terminal. */
      /* The picker look, shared: dialog.picker is the frame (.exHead, a body,
         .exFoot), .exTiles the choices. .cardTiles is two big tiles with a
         line under each name (.tileHint), .pickRow the quiet extra row under
         them, .pickList a list of .listRow to pick one from. Number keys press
         the tiles (tileKeys in main.ts). */
      dialog.picker { padding: 18px 18px 0; }
      .exTiles.cardTiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cardTiles .exTile { gap: 6px; padding: 18px 8px 14px; font-size: 13px; }
      .cardTiles .exTile svg { width: 28px; height: 28px; }
      .tileHint { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pickRow {
        display: flex; align-items: center; gap: 10px; width: 100%; margin: 12px 0 0; padding: 9px 10px;
        border: 1px dashed var(--line); border-radius: 8px; background: none; font-size: 12px; text-align: left; cursor: pointer;
      }
      .pickRow:hover, .pickRow:focus-visible { outline: none; border-color: var(--muted); background: var(--raise); }
      .pickRow svg { flex: none; width: 16px; height: 16px; color: var(--muted); }
      .pickRowText { display: grid; min-width: 0; }
      .pickRowText small { color: var(--muted); font-size: 11px; }
      dialog.picker > .sub, dialog.picker > form > .sub { margin: -6px 0 12px; }
      .footEnd { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
      .pickList { max-height: 46vh; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin: 8px 0 0; }
      .pickList .listRow { flex-direction: row; align-items: center; gap: 10px; }
      .pickList .listRow:focus-visible { outline: none; border-color: var(--live); }
      .pickList .listRow svg { flex: none; width: 16px; height: 16px; color: var(--muted); }
      .pickList .rowText { display: grid; gap: 1px; min-width: 0; flex: 1; }
      .pickList .rowText b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pickList .rowText .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pickList .rowMeta { flex: none; font-size: 11px; color: var(--muted); white-space: nowrap; }
      .pickList .listRow.known .rowMeta { color: var(--live); }
      /* The remote address: one field and its button on a line. */
      .addrRow { display: flex; align-items: center; gap: 8px; }
      .addrRow svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
      .addrRow input { flex: 1; min-width: 0; }
      .addrRow button.go { flex: none; }
      .pickList:empty, #remoteDialog .note:empty, #remoteWayNote:empty, #remoteProjectsNote:empty, #browseError:empty { display: none; }
      .exHead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
      .exHead h2 { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .exHead .sub { margin: 0; white-space: nowrap; }

      .cmpCols { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); max-height: 64vh; overflow: auto; }

      .exOpts { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 0; flex-wrap: wrap; }
      .seg { display: inline-flex; padding: 2px; background: var(--ground); border: 1px solid var(--line); border-radius: 7px; }

      .switch { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); cursor: pointer; border: 0; background: none; padding: 2px 0; }
      .switch i { position: relative; width: 26px; height: 15px; border-radius: 8px; background: var(--line); transition: background-color var(--t-fast) var(--ease); }
      .switch i::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted);
        transition: translate var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease);

      /* On, it is the risky setting, so it reads in the stop colour. */

      #pastSearch { width: 100%; box-sizing: border-box; margin: 0 0 8px; }

      /* Editing: the CodeMirror view fills the pane (colours come from its

      .fileEditor { flex: 1; min-height: 0; display: flex; flex-direction: column; }

      .tok-comment { color: #6a9955; font-style: italic; }

      .tok-string, .tok-string2, .tok-deleted { color: #ce9178; }
      .tok-number, .tok-inserted { color: #b5cea8; }
      .tok-typeName, .tok-className, .tok-namespace { color: #4ec9b0; }

      .tok-emphasis { font-style: italic; } .tok-strong { font-weight: 600; }
      .tok-link, .tok-url { color: #4fc1ff; text-decoration: underline; }

      [data-theme="light"] .tok-keyword, [data-theme="light"] .tok-bool,
      [data-theme="light"] .tok-atom, [data-theme="light"] .tok-null { color: #0000ff; }
      [data-theme="light"] .tok-string, [data-theme="light"] .tok-string2,
      [data-theme="light"] .tok-deleted { color: #a31515; }
      [data-theme="light"] .tok-number, [data-theme="light"] .tok-inserted { color: #098658; }
      [data-theme="light"] .tok-typeName, [data-theme="light"] .tok-className,
      [data-theme="light"] .tok-namespace { color: #267f99; }
      [data-theme="light"] .tok-propertyName, [data-theme="light"] .tok-variableName,

      [data-theme="light"] .tok-definition, [data-theme="light"] .tok-macroName { color: #795e26; }
      [data-theme="light"] .tok-meta { color: #af00db; }
      [data-theme="light"] .tok-heading { color: #0000ff; }

      /* Code and text: one scroller holding a line-number gutter that stays

      .hljs-bullet { color: #6796e6; }
      .hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }
      [data-theme="light"] .hljs-comment, [data-theme="light"] .hljs-quote { color: #008000; }
      [data-theme="light"] .hljs-keyword, [data-theme="light"] .hljs-literal,
      [data-theme="light"] .hljs-selector-tag { color: #0000ff; }
      [data-theme="light"] .hljs-name, [data-theme="light"] .hljs-section { color: #800000; }
      [data-theme="light"] .hljs-string, [data-theme="light"] .hljs-deletion { color: #a31515; }
      [data-theme="light"] .hljs-number, [data-theme="light"] .hljs-addition,
      [data-theme="light"] .hljs-symbol { color: #098658; }
      [data-theme="light"] .hljs-regexp { color: #811f3f; }
      [data-theme="light"] .hljs-title, [data-theme="light"] .hljs-title.function_ { color: #795e26; }
      [data-theme="light"] .hljs-title.class_, [data-theme="light"] .hljs-type,

      /* --- shared controls --------------------------------------------- *
         New UI uses these: write a bare <button>, <input>, <textarea> or
         <select> and it already looks like Lepons. .go marks the main action,
         .listRow is a pickable row in a list. Add a rule only for what differs.
         :where() weighs nothing, so any existing rule for a button still wins;
         a button with a class is left to that class. */
      :where(button:not([class]), button.go) {
        padding: 6px 12px; border-radius: 5px; cursor: pointer;
        border: 1px solid var(--line); background: var(--raise);
      }
      :where(button:not([class]):hover) { border-color: var(--muted); }
      :where(button.go) { background: var(--live); border-color: var(--live); color: #21160a; font-weight: 600; }
      .listRow {
        display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%;

        background: none; text-align: left; overflow-wrap: anywhere; cursor: pointer;
      }
      .listRow:hover { background: var(--raise); border-color: var(--line); }

        border: 1.5px solid var(--muted); background: var(--panel); cursor: pointer; transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
      }
      input[type="radio"] { border-radius: 50%; }

      input[type="radio"]:checked { border-color: var(--live); }

      input[type="checkbox"] { border-radius: 4px; }
      input[type="checkbox"]::before {
        content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid var(--panel); border-width: 0 2px 2px 0;
        transform: rotate(45deg) scale(0); transition: transform var(--t-fast) var(--ease);
      }
      input[type="checkbox"]:checked { border-color: var(--live); background: var(--live); }

      label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 11.5px; }
