# Typecheck and tests for both apps, with no secrets. No path filters on
# purpose: the mobile tests compare mobile's copies against the cockpit's
# originals, so a cockpit-only change has to run them too.
name: Checks

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            cockpit/package-lock.json
      - run: npm ci
      # The mobile tests import the cockpit's sources, which reach ssh2.
      # They run no Electron or native code, so install scripts can be skipped.
      - run: npm ci --ignore-scripts
        working-directory: cockpit
      # expo-env.d.ts and .expo/types are generated and git-ignored; tsc needs them.
      - run: npx expo customize tsconfig.json
      - run: npx tsc --noEmit
      - run: npm test
