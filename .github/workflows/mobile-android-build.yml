# The phone app's Android APK and App Bundle, built unsigned-for-store here and signed on the owner's PC:
# a long-path limit stops the native build on Windows, and the signing key does not leave that PC.
# Run by hand with the version code to use: it must be above the last one given out.
name: Mobile Android build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android version code
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      # The gradle build does not fit on the stock runner.
      - name: Free disk space
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Prebuild
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          npx expo prebuild --platform android --no-install
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          grep -n versionCode android/app/build.gradle

      - name: Build
        working-directory: mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          retention-days: 7
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
