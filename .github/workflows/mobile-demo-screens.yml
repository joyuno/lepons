# Builds the phone app for Android on the runner (no EAS, no secrets),
# walks every main screen in demo mode with Maestro on an emulator, and
# keeps the screenshots as an artifact. Manual only: mobile-store-shots.yml covers
# the screens on every push, and this walk breaks whenever the demo UI changes.
name: Mobile demo screens

on:
  workflow_dispatch: {}

jobs:
  android:
    # "[store-only]" in the commit message leaves this to mobile-store-shots.yml.
    if: ${{ !contains(github.event.head_commit.message, '[store-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      # The gradle build and the emulator's disk image do not both fit on the stock runner.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      # A release APK signed with the template's debug key: installable on an emulator, never shipped.
      - name: Build APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../app-release.apk
          # Gradle's intermediates and caches are not needed past this point.
          cd .. && rm -rf android ~/.gradle/caches
          df -h /

      - name: Install Maestro
        run: |
          # Pinned release zip instead of piping the installer script into bash.
          curl -fsSL -o /tmp/maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip"
          unzip -q /tmp/maestro.zip -d /tmp && mkdir -p "$HOME/.maestro" && cp -r /tmp/maestro/* "$HOME/.maestro/" && rm -rf /tmp/maestro /tmp/maestro.zip
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator needs KVM on the hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk the demo
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          script: |
            adb install app-release.apk
            adb logcat -c
            maestro test maestro/demo-walkthrough.yaml --test-output-dir=maestro-out || (mkdir -p maestro-out && adb logcat -d -b crash > maestro-out/crash.txt; adb logcat -d '*:E' > maestro-out/errors.txt; adb logcat -d ReactNativeJS:V '*:S' > maestro-out/js.txt; exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screens-android
          path: |
            mobile/maestro-out
            mobile/*.png
          if-no-files-found: warn
